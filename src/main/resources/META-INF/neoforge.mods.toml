modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/ArdRiMods/create-dt-fix/issues"

[[mods]]
modId = "create_dt_fix"
version = "1.0.0"
displayName = "Create × Dynamic Trees Fix"
logoFile = "icon.png"
displayURL = "https://modrinth.com/mod/create-dt-fix"
authors = "ArdRiMods"
credits = "Vibe coded: code written by Claude (Anthropic AI); idea, testing and design by ArdRiMods. Saw compat logic based on Create PR #9898 (MIT, The Create Team). Dynamic Trees by DynamicTreesTeam (MIT)."
description = '''
Makes Create machines work with Dynamic Trees (Create 6.0.10, Dynamic Trees 1.7+).
- Mechanical Saw, Drill and other Create breakers cut a whole Dynamic Tree, with drops (into contraption storage on contraptions).
- The tree falls away from the machine (animation only, no duplicate drops).
- Deployer with an axe: drops go to the deployer (and on to contraption storage).
- Saws cut Dynamic Trees surface roots, and axes cut roots at log speed.
- Create's vanilla tree cutter no longer deletes Dynamic Trees with no drops.
- Break cracks always show on branches.
Server-side only: players without this mod can still join.
This mod is vibe coded: the code was written by an AI (Claude) and tested in game by the author.
'''
# Server-side logic only: clients do not need this mod to join a server.
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "create_dt_fix.mixins.json"

# Locked to Create 6.0.10. A newer Create stops the game at launch with a clear message,
# so the mod is checked against the new Create (which may already include the fix).
[[dependencies.create_dt_fix]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.0.11)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.create_dt_fix]]
modId = "dynamictrees"
type = "required"
versionRange = "[1.7.0,)"
ordering = "AFTER"
side = "BOTH"
